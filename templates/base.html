<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Examination Management Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom" aria-label="Main navigation">
    <div class="container gap-3">
      <a class="navbar-brand text-wrap" href="{{ url_for('index') }}">Examination Management Portal</a>
      {% if g.user %}
        {% if g.user['role'] == 'Admin' %}
          <a href="{{ url_for('admin_dashboard') }}">Admin dashboard</a>
        {% endif %}
        <form action="{{ url_for('logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
          <button class="btn btn-outline-secondary" type="submit">Log out</button>
        </form>
      {% else %}
        <div class="d-flex gap-3">
          <a href="{{ url_for('login') }}">Log in</a>
          <a href="{{ url_for('register') }}">Register</a>
        </div>
      {% endif %}
    </div>
  </nav>
  <main class="container py-4">
    <div class="row justify-content-center"><div class="col-12 {% block content_width %}col-md-8 col-lg-6{% endblock %}">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </div></div>
  </main>
</body>
</html>
