{% extends 'base.html' %}
{% block title %}Log in | Examination Management Portal{% endblock %}
{% block content %}
<h1 class="h3">Log in</h1>
<p class="text-secondary">Use your Admin, Examiner, or Student account.</p>
<form method="post" class="bg-white border rounded p-4">
  <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input id="email" name="email" type="email" class="form-control" maxlength="254" autocomplete="username" value="{{ request.form.get('email', '') }}" required>
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
  </div>
  <button class="btn btn-primary" type="submit">Log in</button>
</form>
<p class="mt-3">New Student or Examiner? <a href="{{ url_for('register') }}">Register</a>.</p>
{% endblock %}
